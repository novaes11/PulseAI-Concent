<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseAI Concent</title>

    <!-- Folha de estilos vinculada ao Spring Boot e com suporte a pré-visualização local -->
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="../../static/css/auth.css">
</head>

<body>
    <main class="login-card">
        <header class="login-header">
            <!-- Logotipo Oficial da Concent Sistemas -->
            <div class="logo-container">
                <img th:src="@{/images/logo-concent.png}" src="../../static/images/logo-concent.png"
                    alt="Concent Sistemas - PulseAI Concent" class="brand-logo-img">
            </div>
            <h1 class="brand-title">PulseAI <span>Concent</span></h1>
            <p class="brand-subtitle">Gestão Inteligente de Consentimento Clínico</p>
        </header>

        <!-- Feedback de Logout: exibe apenas quando a URL possui ?logout -->
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            <span>Sessão encerrada com sucesso.</span>
        </div>

        <!-- Formulário integrado ao endpoint POST /login -->
        <form th:action="@{/login}" method="post" novalidate>
            <!-- Proteção CSRF obrigatória (o Thymeleaf injeta automaticamente se o Spring Security estiver ativo) -->
            <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->

            <div class="form-group">
                <label for="username">E-mail ou Usuário</label>
                <input type="text" id="username" name="username" class="form-control"
                    placeholder="usuario@concent.com.br" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                    autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-submit">Acessar Sistema</button>

            <div class="signup-prompt">
                Não é cadastrado? <a th:href="@{/criar-conta}">Crie sua conta!</a>
            </div>

            <!-- Feedback de Erro: exibe apenas quando a URL possui ?error -->
            <div th:if="${param.error}" class="alert alert-error" role="alert">
                <span>Usuário ou senha incorretos. Verifique suas credenciais.</span>
            </div>
        </form>

        <footer class="login-footer">
            <p>&copy; Concent Sistemas &bull; PulseAI Concent. Todos os direitos reservados.</p>
        </footer>
    </main>
</body>

</html>
